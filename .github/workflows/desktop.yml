name: Desktop validation
on:
  pull_request:
  push:
    branches: [feature/universal-inventory-sync]
permissions:
  contents: read
jobs:
  core-and-electron:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run native:electron
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron:scale
      - if: runner.os == 'Windows'
        run: npm run test:electron:scale
      - if: runner.os == 'Windows'
        run: npm run package:win
      - if: runner.os == 'Linux'
        run: npm run package:linux
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - if: runner.os == 'Windows'
        run: npm run test:packaged
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CACADUU-Inventory-win32-x64
          path: release/CACADUU-Inventory-win32-x64/
          retention-days: 7
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  tauri:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev xvfb
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      - run: node --test tests/sidecar.test.cjs
      - run: node scripts/tauri-smoke.cjs
      - if: runner.os == 'Windows'
        run: npx tauri build
      - if: runner.os == 'Linux'
        run: npx tauri build --bundles deb,rpm
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CACADUU-Inventory-tauri-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
